<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Centro Espacial Orión — Junior Mission Orión</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>" />
  <style>
    :root {
      --bg: #0e1622;
      --panel: rgba(10, 18, 28, 0.88);
      --acento: #7fe4ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: #e8eef4;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      overscroll-behavior: none;
    }

    #stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: grab;
    }

    #ui {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 300px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      background: var(--panel);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 14px;
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    #ui h1 { margin: 0 0 2px; font-size: 17px; letter-spacing: 0.4px; }
    #ui p { margin: 0 0 10px; font-size: 11px; color: #9fb0c4; }

    #ui .panel {
      margin-top: 10px;
      padding: 9px 11px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 8px;
    }

    #ui .panel[hidden] { display: none; }

    #ui label { font-size: 12px; color: #9fb0c4; }
    #ui strong { color: #fff; }

    #ui .hint { font-size: 11px; color: #6f87a0; margin-top: 4px; line-height: 1.4; }

    #ui details summary { cursor: pointer; font-size: 12px; color: #9fb0c4; }

    #ui button {
      width: 100%;
      margin-top: 8px;
      padding: 9px 10px;
      background: rgba(60, 140, 210, 0.25);
      color: #e8eef4;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #ui button:hover { background: rgba(60, 140, 210, 0.4); }
    #ui button.reset { background: rgba(210, 80, 60, 0.2); color: #f4c9c4; }

    #btn-interactuar {
      position: fixed;
      right: 22px;
      bottom: 30px;
      z-index: 20;
      display: none;
      padding: 15px 20px;
      border-radius: 999px;
      border: 1px solid rgba(127, 228, 255, 0.65);
      background: rgba(30, 110, 150, 0.55);
      color: #eaffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 22px rgba(40, 224, 255, 0.35);
      cursor: pointer;
      touch-action: manipulation;
    }

    #btn-interactuar.visible { display: block; }
    #btn-interactuar:disabled { opacity: 0.5; }

    #joystick {
      position: fixed;
      left: 22px;
      bottom: 22px;
      width: 126px;
      height: 126px;
      z-index: 20;
      touch-action: none;
      user-select: none;
    }

    #joystick-base {
      position: relative;
      width: 126px;
      height: 126px;
      border-radius: 50%;
      background: rgba(10, 18, 28, 0.5);
      border: 2px solid rgba(127, 228, 255, 0.3);
      backdrop-filter: blur(4px);
    }

    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54px;
      height: 54px;
      margin: -27px 0 0 -27px;
      border-radius: 50%;
      background: rgba(127, 228, 255, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.65);
      box-shadow: 0 0 18px rgba(127, 228, 255, 0.35);
    }

    #ayuda {
      position: fixed;
      right: 16px;
      bottom: 16px;
      max-width: 280px;
      text-align: right;
      font-size: 11px;
      line-height: 1.5;
      color: #8098ae;
      z-index: 9;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      #ui { width: 240px; padding: 10px; }
      #ui .panel { margin-top: 8px; padding: 8px 9px; }
      #ui h1 { font-size: 15px; }
      #ui p { font-size: 10px; }
      #ayuda { display: none; }
      #btn-interactuar { right: 16px; bottom: 24px; padding: 13px 17px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="ui">
    <h1>Centro Espacial Orión</h1>
    <p>Explora el complejo como astronauta</p>
    <div id="status" class="panel"></div>
    <div id="activity" class="panel"></div>
    <div id="score" class="panel"></div>
    <div id="accion" class="panel" hidden><label id="accion-texto"></label></div>
    <details class="panel">
      <summary>Opciones</summary>
      <button class="reset">Restablecer estado</button>
      <button class="reset">Restablecer puntuación</button>
    </details>
  </div>

  <button id="btn-interactuar">Interactuar</button>

  <div id="joystick" aria-hidden="true">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
  </div>

  <div id="ayuda">WASD / joystick para moverte · Arrastra para girar la cámara · E para interactuar</div>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>

  <script type="module">
    import { initEngine } from './src/motor.js';
    import { createUI } from './src/ui.js';

    const statusBox = document.getElementById('status');
    const activityBox = document.getElementById('activity');
    const scoreBox = document.getElementById('score');

    const { scene, camera, renderer, juego } = initEngine('stage');
    const ui = createUI(document.getElementById('ui'), {
      energy: 100,
      fun: 100,
      hygiene: 100,
      social: 100,
    });
    juego.conectarUI(ui);

    const etiquetas = { energy: 'Energía', fun: 'Diversión', hygiene: 'Higiene', social: 'Social' };
    const clavesEstado = ['energy', 'fun', 'hygiene', 'social'];

    const pintarEstado = () => {
      statusBox.innerHTML = clavesEstado
        .map((clave) => `<label>${etiquetas[clave]}: <strong>${Math.round(ui.state[clave])}</strong></label>`)
        .join('');
    };

    const pintarActividad = () => {
      const actividad = ui.state.currentActivity;
      if (!actividad) {
        activityBox.innerHTML = '<div class="hint">Acércate a una instalación para interactuar.</div>';
        return;
      }
      const restante = Math.max(0, Math.ceil(actividad.duration - ui.state.timer));
      activityBox.innerHTML =
        `<label>Actividad: <strong>${actividad.name}</strong></label>` +
        `<div class="hint" style="color:#ffe27a;font-weight:700;margin-top:6px">Tiempo restante: ${restante}s</div>`;
    };

    const pintarPuntuacion = () => {
      scoreBox.innerHTML =
        `<label>Investigación: <strong>${ui.state.score.research}</strong></label>` +
        `<div class="hint">Experiencia: ${ui.state.score.experience}</div>`;
    };

    let anterior = performance.now();
    const tick = (ahora) => {
      requestAnimationFrame(tick);
      const dt = Math.min((ahora - anterior) / 1000, 0.1);
      anterior = ahora;
      ui.actualizar(dt);
      juego.actualizar(dt);
      pintarEstado();
      pintarActividad();
      pintarPuntuacion();
      renderer.render(scene, camera);
    };
    requestAnimationFrame(tick);
  </script>
</body>
</html>
